<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Fromages de France</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap');

:root {
  --gold:#c9a84c; --gold2:#e8c97a; --ink:#0f0b06; --parch:#faf6ee;
  --parch2:#f0e8d5; --rust:#8b3a1a; --cream:#fffdf7;
  --fs:1;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--ink);}

#app{
  position:fixed;top:0;left:0;right:0;bottom:0;
  display:flex;flex-direction:column;
  background:var(--ink);overflow:hidden;
  font-family:'Cormorant Garamond',serif;color:var(--parch);
}

/* HEADER */
.header{
  flex-shrink:0;
  padding:calc(14px + env(safe-area-inset-top)) 16px 10px;
  background:var(--ink);
  border-bottom:1px solid rgba(201,168,76,0.25);
  text-align:center;
}
.header h1{
  font-family:'IM Fell English',serif;
  font-size:calc(22px * var(--fs));
  color:var(--gold);
  letter-spacing:0.04em;
}
.header p{
  font-size:calc(11px * var(--fs));
  color:rgba(201,168,76,0.6);
  margin-top:2px;
  font-style:italic;
}

/* SEARCH */
.search-bar{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--ink);
}
.search-wrap{position:relative;flex:1;}
.search-wrap input{
  width:100%;
  background:rgba(201,168,76,0.08);
  border:1px solid rgba(201,168,76,0.25);
  border-radius:20px;
  padding:7px 32px 7px 14px;
  color:var(--parch);
  font-family:'Cormorant Garamond',serif;
  font-size:calc(15px * var(--fs));
}
.search-wrap input::placeholder{color:rgba(201,168,76,0.4);}
.search-wrap input:focus{outline:none;border-color:var(--gold);}
.btn-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  display:none;align-items:center;justify-content:center;
  background:none;border:none;color:var(--gold);font-size:16px;cursor:pointer;
  width:20px;height:20px;
}

/* FILTERS */
.filters{
  flex-shrink:0;
  padding:6px 14px;
  background:var(--ink);
  border-bottom:1px solid rgba(201,168,76,0.15);
  overflow-x:auto;
  white-space:nowrap;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.chip{
  display:inline-block;
  margin-right:6px;
  padding:4px 12px;
  border-radius:14px;
  border:1px solid rgba(201,168,76,0.3);
  font-size:calc(12px * var(--fs));
  color:rgba(201,168,76,0.7);
  cursor:pointer;
  font-family:'Cormorant Garamond',serif;
  transition:all 0.2s;
  background:transparent;
}
.chip.active{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600;}

/* TABS */
.tabs{
  flex-shrink:0;
  display:flex;
  border-bottom:1px solid rgba(201,168,76,0.2);
  background:var(--ink);
}
.tab{
  flex:1;padding:9px 4px;
  text-align:center;
  font-size:calc(11px * var(--fs));
  color:rgba(201,168,76,0.5);
  cursor:pointer;
  font-family:'Cormorant Garamond',serif;
  letter-spacing:0.05em;
  text-transform:uppercase;
  border-bottom:2px solid transparent;
  transition:all 0.2s;
}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* MAIN */
.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.panel{display:none;}
.panel.active{display:block;}

/* LISTE */
#panel-liste{
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
}
.count-bar{
  font-size:calc(11px * var(--fs));
  color:rgba(201,168,76,0.5);
  margin-bottom:10px;
  font-style:italic;
}
.fromage-card{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  margin-bottom:8px;
  background:rgba(201,168,76,0.06);
  border:1px solid rgba(201,168,76,0.18);
  border-radius:10px;
  cursor:pointer;
  transition:background 0.15s;
}
.fromage-card:active{background:rgba(201,168,76,0.12);}
.card-avatar{
  width:52px;height:52px;border-radius:8px;
  background:rgba(201,168,76,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;overflow:hidden;
}
.card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.card-info{flex:1;min-width:0;}
.card-name{
  font-family:'IM Fell English',serif;
  font-size:calc(16px * var(--fs));
  color:var(--parch);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-region{
  font-size:calc(12px * var(--fs));
  color:var(--gold);
  margin-top:2px;
}
.card-badges{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;}
.badge{
  font-size:calc(10px * var(--fs));
  padding:1px 7px;border-radius:10px;
  border:1px solid rgba(201,168,76,0.4);
  color:rgba(201,168,76,0.8);
}
.badge.aop{border-color:rgba(180,60,20,0.6);color:rgba(220,100,60,0.9);}

/* CARTE */
#panel-carte{
  height:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
#map{width:100%;height:100%;}

/* QUIZ */
#panel-quiz{
  padding:16px 14px calc(12px + env(safe-area-inset-bottom));
}
.quiz-header{
  font-family:'IM Fell English',serif;
  font-size:calc(18px * var(--fs));
  color:var(--gold);
  text-align:center;
  margin-bottom:16px;
}
.quiz-score{
  text-align:center;
  font-size:calc(13px * var(--fs));
  color:rgba(201,168,76,0.6);
  margin-bottom:18px;
}
.quiz-question{
  background:rgba(201,168,76,0.08);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
}
.quiz-img{
  width:100%;height:140px;
  border-radius:8px;
  background:rgba(201,168,76,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;
  margin-bottom:12px;overflow:hidden;
}
.quiz-img img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
.quiz-q{
  font-size:calc(15px * var(--fs));
  color:var(--parch);
  text-align:center;
  line-height:1.4;
}
.quiz-choices{display:flex;flex-direction:column;gap:8px;}
.quiz-btn{
  padding:11px 16px;
  background:rgba(201,168,76,0.07);
  border:1px solid rgba(201,168,76,0.25);
  border-radius:10px;
  color:var(--parch);
  font-family:'Cormorant Garamond',serif;
  font-size:calc(15px * var(--fs));
  cursor:pointer;text-align:left;
  transition:all 0.2s;
}
.quiz-btn.correct{background:rgba(40,160,80,0.25);border-color:#28a050;color:#7dda9a;}
.quiz-btn.wrong{background:rgba(180,40,40,0.2);border-color:#b42828;color:#e07070;}
.quiz-next{
  width:100%;margin-top:14px;
  padding:12px;border-radius:10px;
  background:var(--gold);color:var(--ink);
  font-family:'IM Fell English',serif;
  font-size:calc(16px * var(--fs));
  font-weight:600;border:none;cursor:pointer;
  display:none;
}
.quiz-restart{
  width:100%;margin-top:10px;
  padding:12px;border-radius:10px;
  background:transparent;color:var(--gold);
  font-family:'Cormorant Garamond',serif;
  font-size:calc(14px * var(--fs));
  border:1px solid var(--gold);cursor:pointer;
}

/* DETAIL OVERLAY */
.detail-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--ink);z-index:100;
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 0.3s ease;
}
.detail-overlay.open{transform:translateX(0);}
.detail-header{
  flex-shrink:0;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  background:var(--ink);
  border-bottom:1px solid rgba(201,168,76,0.2);
  display:flex;align-items:center;gap:12px;
}
.btn-back{
  background:none;border:none;color:var(--gold);
  font-size:24px;cursor:pointer;padding:0;flex-shrink:0;
}
.detail-title{
  flex:1;
  font-family:'IM Fell English',serif;
  font-size:calc(20px * var(--fs));
  color:var(--parch);
}
.btn-lang{
  background:none;border:none;cursor:pointer;
  font-size:22px;flex-shrink:0;
}
.detail-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
}
.detail-hero{
  width:100%;height:200px;border-radius:12px;
  background:rgba(201,168,76,0.1);
  display:flex;align-items:center;justify-content:center;
  font-size:80px;margin-bottom:16px;
  overflow:hidden;position:relative;
}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.d-badge{
  padding:3px 10px;border-radius:12px;
  font-size:calc(12px * var(--fs));
  border:1px solid rgba(201,168,76,0.4);color:rgba(201,168,76,0.9);
}
.d-badge.aop{border-color:rgba(180,60,20,0.6);color:rgba(220,100,60,0.9);}
.detail-section{margin-bottom:14px;}
.detail-label{
  font-size:calc(10px * var(--fs));
  letter-spacing:0.1em;text-transform:uppercase;
  color:var(--gold);margin-bottom:4px;
  font-family:'Cormorant Garamond',serif;
}
.detail-value{
  font-size:calc(15px * var(--fs));
  color:var(--parch);line-height:1.5;
}
.detail-bio{
  font-size:calc(14px * var(--fs));
  color:rgba(250,246,238,0.85);
  line-height:1.65;font-style:italic;
}
.detail-row{
  display:flex;gap:10px;margin-bottom:14px;
}
.detail-row .detail-section{flex:1;}
.affinage-bar{
  height:6px;border-radius:3px;
  background:rgba(201,168,76,0.15);
  margin-top:6px;overflow:hidden;
}
.affinage-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold2));
}

/* SETTINGS */
.settings-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:var(--ink);z-index:200;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 0.3s ease;
}
.settings-overlay.open{transform:translateX(0);}
.settings-header{
  flex-shrink:0;
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid rgba(201,168,76,0.2);
}
.settings-title{
  font-family:'IM Fell English',serif;
  font-size:calc(20px * var(--fs));color:var(--gold);
}
.settings-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
}
.settings-section-title{
  font-size:calc(10px * var(--fs));
  letter-spacing:0.12em;text-transform:uppercase;
  color:rgba(201,168,76,0.5);margin:16px 0 8px;
}
.font-btns{display:flex;gap:8px;margin-bottom:12px;}
.font-btn{
  padding:7px 16px;border-radius:8px;
  border:1px solid rgba(201,168,76,0.3);
  background:transparent;color:var(--gold);
  font-size:16px;cursor:pointer;
}
.apps-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-bottom:16px;
}
.app-item{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.app-icon{
  width:56px;height:56px;border-radius:13px;
  background:rgba(201,168,76,0.1);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.app-icon img{width:56px;height:56px;border-radius:13px;}
.app-name{font-size:9px;color:rgba(250,246,238,0.6);text-align:center;line-height:1.2;}
.badge-store{
  display:block;margin:0 auto 16px;height:40px;
}

@media (min-width:768px){
  :root{--fs:1.3;}
  .header h1{font-size:calc(28px * var(--fs));}
  .apps-grid{grid-template-columns:repeat(6,1fr);}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 id="ui-title">🧀 Fromages de France</h1>
    <p id="ui-subtitle">Encyclopédie fromagère</p>
  </div>

  <div class="search-bar">
    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Rechercher un fromage…">
      <button class="btn-clear" id="btn-clear" onclick="clearSearch()">✕</button>
    </div>
    <button class="btn-lang" id="btn-lang-main" onclick="toggleLang()">🇬🇧</button>
  </div>

  <div class="filters" id="filters-bar"></div>

  <div class="tabs">
    <div class="tab active" id="tab-liste" onclick="switchTab('liste',this)">Liste</div>
    <div class="tab" id="tab-carte" onclick="switchTab('carte',this)">Carte</div>
    <div class="tab" id="tab-quiz" onclick="switchTab('quiz',this)">Quiz</div>
    <div class="tab" onclick="openSettings();highlightTab(this)" id="tab-apps">📱</div>
  </div>

  <div class="main">
    <div id="panel-liste" class="panel active">
      <div style="padding:10px 14px 0">
        <div class="count-bar" id="count-bar"></div>
      </div>
      <div style="padding:0 14px calc(12px + env(safe-area-inset-bottom))" id="liste-container"></div>
    </div>
    <div id="panel-carte" class="panel">
      <div id="map"></div>
    </div>
    <div id="panel-quiz" class="panel">
      <div class="quiz-header" id="ui-quiz-header">Quiz Fromages</div>
      <div class="quiz-score" id="quiz-score"></div>
      <div id="quiz-container"></div>
    </div>
  </div>
</div>

<!-- DETAIL -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-header">
    <button class="btn-back" onclick="closeDetail()">‹</button>
    <div class="detail-title" id="d-title"></div>
  </div>
  <div class="detail-body">
    <div class="detail-hero" id="d-hero"><span id="d-emoji"></span></div>
    <div class="detail-badges" id="d-badges"></div>
    <div class="detail-row">
      <div class="detail-section">
        <div class="detail-label" id="d-label-region">Région</div>
        <div class="detail-value" id="d-region"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label" id="d-label-lait">Lait</div>
        <div class="detail-value" id="d-lait"></div>
      </div>
    </div>
    <div class="detail-row">
      <div class="detail-section">
        <div class="detail-label" id="d-label-famille">Famille</div>
        <div class="detail-value" id="d-famille"></div>
      </div>
      <div class="detail-section">
        <div class="detail-label" id="d-label-affinage">Affinage</div>
        <div class="detail-value" id="d-affinage"></div>
        <div class="affinage-bar"><div class="affinage-fill" id="d-affinage-bar"></div></div>
      </div>
    </div>
    <div class="detail-section">
      <div class="detail-label" id="d-label-desc">Description</div>
      <div class="detail-bio" id="d-bio"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" id="d-label-accord">Accord</div>
      <div class="detail-value" id="d-accord"></div>
    </div>
    <div class="detail-section">
      <div class="detail-label" id="d-label-anecdote">Le saviez-vous ?</div>
      <div class="detail-value" id="d-anecdote"></div>
    </div>

  </div>
</div>

<!-- SETTINGS -->
<div class="settings-overlay" id="settings-overlay">
  <div class="settings-header">
    <button class="btn-back" onclick="closeSettings()">‹</button>
    <div class="settings-title">Réglages</div>
  </div>
  <div class="settings-body" id="settings-body"></div>
</div>

// ==================== STATE ====================
var currentTab = 'liste';
var currentFilter = 'tous';
var currentLangDetail = 'fr';
var searchQuery = '';
var currentFromage = null;
var mapInstance = null;
var mapInitialized = false;
var quizScore = 0, quizTotal = 0, quizCurrent = null;
var urlCache = {};

// ==================== FILTERS ====================
var FILTERS = [
  {key:'tous', label:'Tous'},
  {key:'aop', label:'AOP/AOC'},
  {key:'vache', label:'🐄 Vache'},
  {key:'chevre', label:'🐐 Chèvre'},
  {key:'brebis', label:'🐑 Brebis'},
  {key:'bleu', label:'Bleu'},
  {key:'chaud', label:'À fondre'},
  {key:'normandie', label:'Normandie'},
  {key:'auvergne', label:'Auvergne'},
  {key:'savoie', label:'Savoie'},
  {key:'bourgogne', label:'Bourgogne'},
  {key:'alsace', label:'Alsace'},
  {key:'loire', label:'Loire'},
  {key:'sud', label:'Sud'},
  {key:'nord', label:'Nord'},
];

function buildFilters(){
  var bar = document.getElementById('filters-bar');
  bar.innerHTML = FILTERS.map(function(f){
    return '<button class="chip'+(f.key===currentFilter?' active':'')+'" onclick="setFilter(\''+f.key+'\')">'+f.label+'</button>';
  }).join('');
}

function setFilter(k){
  currentFilter = k;
  buildFilters();
  renderListe();
  if(currentTab==='carte') renderCarte();
}

function matchFilter(f){
  if(currentFilter==='tous') return true;
  if(currentFilter==='aop') return f.aop;
  if(currentFilter==='vache') return f.lait.toLowerCase().includes('vache');
  if(currentFilter==='chevre') return f.lait.toLowerCase().includes('chèvre') || f.lait.toLowerCase().includes('chevre');
  if(currentFilter==='brebis') return f.lait.toLowerCase().includes('brebis');
  if(currentFilter==='bleu') return f.famille.toLowerCase().includes('persillée');
  if(currentFilter==='chaud') return f.famille.toLowerCase().includes('pressée cuite') || f.nom.toLowerCase().includes('raclette') || f.nom.toLowerCase().includes('emmental');
  var regions = {normandie:'Normandie',auvergne:'Auvergne',savoie:'Savoie',bourgogne:'Bourgogne',alsace:'Alsace',
    loire:'Loire',sud:'Occitanie',nord:'Hauts-de-France'};
  if(regions[currentFilter]) return f.region.toLowerCase().includes(regions[currentFilter].toLowerCase()) || f.region.toLowerCase().includes(currentFilter);
  return true;
}

function getFiltered(){
  return FROMAGES.filter(function(f){
    var mf = matchFilter(f);
    if(!mf) return false;
    if(searchQuery){
      var q = searchQuery.toLowerCase();
      return f.nom.toLowerCase().includes(q) || f.region.toLowerCase().includes(q) || f.famille.toLowerCase().includes(q) || f.lait.toLowerCase().includes(q);
    }
    return true;
  });
}

// ==================== LISTE ====================
function renderListe(){
  var list = getFiltered();
  document.getElementById('count-bar').textContent = list.length + ' fromage' + (list.length>1?'s':'');
  var html = '';
  list.forEach(function(f){
    html += '<div class="fromage-card" onclick="openDetail('+f.id+')">';
    html += '<div class="card-avatar" id="av-'+f.id+'"><span>'+f.emoji+'</span></div>';
    html += '<div class="card-info">';
    html += '<div class="card-name">'+f.nom+'</div>';
    html += '<div class="card-region">'+f.region+'</div>';
    html += '<div class="card-badges">';
    if(f.aop) html += '<span class="badge aop">AOP</span>';
    html += '<span class="badge">'+f.lait.split(' ')[0]+'</span>';
    html += '<span class="badge">'+f.famille.split(' ').slice(0,2).join(' ')+'</span>';
    html += '</div></div></div>';
  });
  document.getElementById('liste-container').innerHTML = html;
  // lazy load images
  list.forEach(function(f){ loadAvatar(f); });
}

function loadAvatar(f){
  if(urlCache['av_'+f.id]) return setAvatarImg(f.id, urlCache['av_'+f.id]);
  if(f.wt){
    if(typeof CapacitorHttp!=='undefined'){
      CapacitorHttp.get({url:f.wt,responseType:'arraybuffer'}).then(function(r){
        var b64='data:image/jpeg;base64,'+r.data;
        urlCache['av_'+f.id]=b64;
        urlCache['hero_'+f.id]=urlCache['hero_'+f.id]||b64;
        setAvatarImg(f.id,b64);
      }).catch(function(){
        urlCache['av_'+f.id]=f.wt;
        setAvatarImg(f.id,f.wt);
      });
    } else {
      urlCache['av_'+f.id]=f.wt;
      setAvatarImg(f.id,f.wt);
    }
    return;
  }
  if(!f.wiki) return;
  var url = 'https://fr.wikipedia.org/w/api.php?action=query&titles='+f.wiki+'&prop=pageimages&pithumbsize=100&format=json&origin=*';
  fetch(url).then(function(r){return r.json();}).then(function(d){
    var pages = d.query && d.query.pages;
    if(!pages) return;
    var page = Object.values(pages)[0];
    if(page && page.thumbnail && page.thumbnail.source){
      urlCache['av_'+f.id] = page.thumbnail.source;
      setAvatarImg(f.id, page.thumbnail.source);
    }
  }).catch(function(){});
}

function setAvatarImg(id, src){
  var el = document.getElementById('av-'+id);
  if(!el) return;
  el.innerHTML = '<img src="'+src+'" onerror="this.style.display=\'none\'">';
}

// ==================== CARTE ====================
function initMap(){
  if(mapInitialized) return;
  mapInitialized = true;
  mapInstance = L.map('map', {zoomControl:true}).setView([46.5, 2.5], 5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap, CartoDB',maxZoom:18}).addTo(mapInstance);
  renderCarte();
}

function renderCarte(){
  if(!mapInstance) return;
  mapInstance.eachLayer(function(l){ if(l instanceof L.Marker) mapInstance.removeLayer(l); });
  var list = getFiltered();
  list.forEach(function(f){
    var icon = L.divIcon({html:'<div style="font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8))">'+f.emoji+'</div>',
      iconSize:[30,30],iconAnchor:[15,15],className:''});
    var m = L.marker([f.lat, f.lng], {icon:icon}).addTo(mapInstance);
    m.bindPopup('<div style="font-family:\'Cormorant Garamond\',serif;color:#0f0b06;min-width:140px">'+
      '<strong style="font-size:15px">'+f.nom+'</strong><br>'+
      '<span style="font-size:12px;color:#8b3a1a">'+f.region+'</span><br>'+
      '<span style="font-size:12px">'+f.lait+'</span>'+(f.aop?'<br><span style="font-size:11px;color:#c9a84c">✓ AOP</span>':'')+
      '</div>');
    m.on('click', function(){ setTimeout(function(){ openDetail(f.id); }, 400); });
  });
}

// ==================== DETAIL ====================
function openDetail(id){
  currentFromage = FROMAGES.find(function(f){ return f.id===id; });
  if(!currentFromage) return;
  renderDetailContent();
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail(){
  document.getElementById('detail-overlay').classList.remove('open');
}

function toggleLang(){
  currentLangDetail = currentLangDetail==='fr' ? 'en' : 'fr';
  var en = currentLangDetail==='en';
  document.getElementById('btn-lang-main').textContent = en ? '🇫🇷' : '🇬🇧';
  // Titre et sous-titre
  document.getElementById('ui-title').textContent = en ? '🧀 French Cheeses' : '🧀 Fromages de France';
  document.getElementById('ui-subtitle').textContent = en ? 'Cheese encyclopedia' : 'Encyclopédie fromagère';
  // Onglets
  document.getElementById('tab-liste').textContent = en ? 'List' : 'Liste';
  document.getElementById('tab-carte').textContent = en ? 'Map' : 'Carte';
  document.getElementById('tab-quiz').textContent = en ? 'Quiz' : 'Quiz';
  // Search placeholder
  document.getElementById('search-input').placeholder = en ? 'Search a cheese…' : 'Rechercher un fromage…';
  // Quiz header
  document.getElementById('ui-quiz-header').textContent = en ? 'Cheese Quiz' : 'Quiz Fromages';
  // Fiche detail ouverte
  if(currentFromage) updateDetailTexts();
  // Relister / relancer quiz selon onglet actif
  if(currentTab==='liste') renderListe();
  if(currentTab==='quiz') nextQuiz();
}

function renderDetailContent(){
  var f = currentFromage;
  document.getElementById('d-title').textContent = f.nom;
  // Hero : reset puis emoji de fond
  var hero = document.getElementById('d-hero');
  hero.innerHTML = '<span id="d-emoji" style="position:absolute;font-size:80px;opacity:0.4">'+f.emoji+'</span><img id="d-hero-img" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:12px;display:none">';
  // Charger photo — priorité : wt direct, puis cache, puis wiki
  if(f.wt){
    urlCache['hero_'+f.id] = f.wt;
    urlCache['av_'+f.id] = urlCache['av_'+f.id] || f.wt;
    var heroImg = document.getElementById('d-hero-img');
    if(heroImg){
      if(typeof CapacitorHttp!=='undefined'){
        CapacitorHttp.get({url:f.wt,responseType:'arraybuffer'}).then(function(r){
          var b64='data:image/jpeg;base64,'+r.data;
          urlCache['hero_'+f.id]=b64;
          urlCache['av_'+f.id]=b64;
          setHeroImg(b64);
        }).catch(function(){ setHeroImg(f.wt); });
      } else {
        setHeroImg(f.wt);
      }
    }
  } else if(urlCache['hero_'+f.id]){
    setHeroImg(urlCache['hero_'+f.id]);
  } else if(f.wiki) {
    var url = 'https://fr.wikipedia.org/w/api.php?action=query&titles='+f.wiki+'&prop=pageimages&pithumbsize=600&format=json&origin=*';
    fetch(url).then(function(r){return r.json();}).then(function(d){
      var pages = d.query && d.query.pages;
      if(!pages) return;
      var page = Object.values(pages)[0];
      if(page && page.thumbnail && page.thumbnail.source){
        urlCache['hero_'+f.id] = page.thumbnail.source;
        urlCache['av_'+f.id] = urlCache['av_'+f.id] || page.thumbnail.source;
        setHeroImg(page.thumbnail.source);
      }
    }).catch(function(){});
  }
  // Badges
  var bHtml = '';
  if(f.aop) bHtml += '<span class="d-badge aop">AOP/AOC</span>';
  bHtml += '<span class="d-badge">'+f.famille+'</span>';
  document.getElementById('d-badges').innerHTML = bHtml;
  // Affinage bar
  var pct = Math.min(100, Math.round(f.affinage_max / 24 * 100));
  document.getElementById('d-affinage-bar').style.width = pct+'%';
  updateDetailTexts();
}

function setHeroImg(src){
  var img = document.getElementById('d-hero-img');
  if(!img) return;
  img.onload = function(){ img.style.display = 'block'; };
  img.onerror = function(){ img.style.display = 'none'; };
  img.src = src;
}

function updateDetailTexts(){
  var f = currentFromage;
  var fr = currentLangDetail==='fr';
  document.getElementById('d-label-region').textContent = fr ? 'Région' : 'Region';
  document.getElementById('d-label-lait').textContent = fr ? 'Lait' : 'Milk';
  document.getElementById('d-label-famille').textContent = fr ? 'Famille' : 'Family';
  document.getElementById('d-label-affinage').textContent = fr ? 'Affinage' : 'Maturation';
  document.getElementById('d-label-desc').textContent = fr ? 'Description' : 'Description';
  document.getElementById('d-label-accord').textContent = fr ? 'Accord' : 'Pairing';
  document.getElementById('d-label-anecdote').textContent = fr ? 'Le saviez-vous ?' : 'Did you know?';
  document.getElementById('d-region').textContent = f.region;
  document.getElementById('d-lait').textContent = f.lait;
  document.getElementById('d-famille').textContent = f.famille;
  var affinageMin = f.affinage_min || 1;
  var affinageMax = f.affinage_max || 4;
  document.getElementById('d-affinage').textContent = affinageMin+' – '+affinageMax+(fr?' mois':' months');
  document.getElementById('d-bio').textContent = fr ? f.desc : (f.en_desc || f.desc);
  document.getElementById('d-accord').textContent = f.accord;
  document.getElementById('d-anecdote').textContent = f.anecdote;
}

document.getElementById('search-input').oninput = function(){

// ==================== TABS ====================
function switchTab(tab, el){
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.getElementById('panel-'+tab).classList.add('active');
  if(tab==='carte'){ setTimeout(initMap, 100); }
  if(tab==='quiz') initQuiz();
}

// ==================== QUIZ ====================
function initQuiz(){
  quizScore = 0; quizTotal = 0;
  document.getElementById('quiz-score').textContent = '';
  nextQuiz();
}

function nextQuiz(){
  var en = currentLangDetail==='en';
  var list = FROMAGES.filter(function(f){ return f.aop; });
  var idx = Math.floor(Math.random()*list.length);
  quizCurrent = list[idx];
  var types = ['region','lait','famille'];
  var qType = types[Math.floor(Math.random()*types.length)];
  var question = '';
  var correct = '';
  var nom = quizCurrent.nom;
  if(qType==='region'){
    question = en ? 'Which region does '+nom+' come from?' : 'De quelle région vient le '+nom+' ?';
    correct = quizCurrent.region;
  } else if(qType==='lait'){
    question = en ? 'Which milk is '+nom+' made from?' : 'Avec quel lait est fabriqué le '+nom+' ?';
    correct = quizCurrent.lait.split(' ')[0];
  } else {
    question = en ? 'Which family does '+nom+' belong to?' : 'À quelle famille appartient le '+nom+' ?';
    correct = quizCurrent.famille.split(' ').slice(0,3).join(' ');
  }

  var wrongs = [];
  var pool = FROMAGES.filter(function(f){ return f.id !== quizCurrent.id; });
  pool.sort(function(){ return Math.random()-0.5; });
  pool.forEach(function(f){
    if(wrongs.length>=3) return;
    var w;
    if(qType==='region') w = f.region;
    else if(qType==='lait') w = f.lait.split(' ')[0];
    else w = f.famille.split(' ').slice(0,3).join(' ');
    if(w !== correct && !wrongs.includes(w)) wrongs.push(w);
  });
  var choices = [correct].concat(wrongs.slice(0,3));
  choices.sort(function(){ return Math.random()-0.5; });

  var imgHtml = urlCache['hero_'+quizCurrent.id]
    ? '<img src="'+urlCache['hero_'+quizCurrent.id]+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">'
    : quizCurrent.emoji;

  var html = '<div class="quiz-question">';
  html += '<div class="quiz-img">'+imgHtml+'</div>';
  html += '<div class="quiz-q">'+question+'</div>';
  html += '</div>';
  html += '<div class="quiz-choices">';
  choices.forEach(function(c){
    html += '<button class="quiz-btn" onclick="answerQuiz(this,\''+c.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\',\''+correct.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\')" >'+c+'</button>';
  });
  html += '</div>';
  html += '<button class="quiz-next" id="quiz-next-btn" onclick="nextQuiz()">'+(en ? 'Next question →' : 'Question suivante →')+'</button>';
  document.getElementById('quiz-container').innerHTML = html;
  document.getElementById('quiz-score').textContent = (en ? 'Score: ' : 'Score : ')+quizScore+' / '+quizTotal;
}

function answerQuiz(btn, chosen, correct){
  var en = currentLangDetail==='en';
  quizTotal++;
  var isCorrect = chosen === correct;
  if(isCorrect){ quizScore++; btn.classList.add('correct'); }
  else {
    btn.classList.add('wrong');
    document.querySelectorAll('.quiz-btn').forEach(function(b){
      if(b.textContent === correct) b.classList.add('correct');
    });
  }
  document.querySelectorAll('.quiz-btn').forEach(function(b){ b.disabled = true; });
  document.getElementById('quiz-next-btn').style.display = 'block';
  document.getElementById('quiz-score').textContent = (en ? 'Score: ' : 'Score : ')+quizScore+' / '+quizTotal;
}

var settingsCache = {};
function openSettings(){
  document.getElementById('settings-overlay').classList.add('open');
  renderSettings();
}
function closeSettings(){
  document.getElementById('settings-overlay').classList.remove('open');
  // deselect tab-apps highlight
  document.getElementById('tab-apps').classList.remove('active');
}
function highlightTab(el){
  // just briefly highlight, don't stay active
  el.classList.add('active');
}
function renderSettings(){
  var body = document.getElementById('settings-body');
  if(body.dataset.rendered){
    APPS.forEach(function(a){
      if(settingsCache[a.id]){
        var img = document.getElementById('icon-'+a.id);
        if(img && !img.src.includes('mzstatic')) img.src = settingsCache[a.id];
      }
    });
    return;
  }
  body.dataset.rendered = '1';
  var html = '';
  APPS_CATS.forEach(function(cat){
    html += '<div class="settings-section-title">'+cat.cat+'</div>';
    html += '<div class="apps-grid">';
    cat.apps.forEach(function(a){
      html += '<div class="app-item" onclick="window.open(\'https://apps.apple.com/app/id'+a.id+'\',\'_system\')">';
      html += '<div class="app-icon"><img id="icon-'+a.id+'" alt="'+a.n+'" style="width:56px;height:56px;border-radius:13px;display:block"></div>';
      html += '<div class="app-name">'+a.n+'</div></div>';
    });
    html += '</div>';
  });
  html += '<img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/fr-fr" class="badge-store" alt="App Store">';
  body.innerHTML = html;
  APPS.forEach(function(a){ loadAppIcon(a.id); });
}
function loadAppIcon(numId){
  if(!numId) return;
  if(settingsCache[numId]){
    var img = document.getElementById('icon-'+numId);
    if(img) img.src = settingsCache[numId];
    return;
  }
  window['itcb'+numId] = function(d){
    if(d && d.results && d.results[0]){
      var src = d.results[0].artworkUrl60;
      settingsCache[numId] = src;
      var img = document.getElementById('icon-'+numId);
      if(img) img.src = src;
    }
  };
  var s = document.createElement('script');
  s.src = 'https://itunes.apple.com/lookup?id='+numId+'&callback=itcb'+numId;
  document.body.appendChild(s);
}

// ==================== INIT ====================
buildFilters();
renderListe();
</script>
